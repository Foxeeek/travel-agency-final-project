<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(#{users.title})}">
</head>

<body>

<nav th:replace="~{fragments/layout :: navbar}">
</nav>

<div class="container mt-4">
    <h1 th:text="#{users.title}"></h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">

            <thead>
            <tr>
                <th th:text="#{users.col.login}"></th>
                <th th:text="#{users.col.role}"></th>
                <th th:text="#{users.col.phone}"></th>
                <th th:text="#{users.col.balance}"></th>
                <th th:text="#{users.col.status}"></th>
                <th th:text="#{users.col.action}"></th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="u : ${users}">

                <td th:text="${u.username}"></td>

                <td>
                    <span th:if="${u.role == 'ADMIN'}"
                          th:text="#{|enum.Role.${u.role}|}"
                    >

                    </span>
                <form th:action="@{/manage/users/{id}/role(id=${u.id})}"
                      class="d-flex align-items-center gap-2 "
                      th:if="${u.role != 'ADMIN'}"
                      method="post">

                    <select name="role" class="form-select form-select-sm">
                        <option th:each="r : ${T(com.epam.finaltask.model.Role).values()}"
                                th:value="${r}" th:text="#{|enum.Role.${r}|}"
                                th:selected="${r.name() == u.role}"></option>
                    </select>

                    <button class="btn btn-sm btn-outline-primary" th:text="#{users.save}"></button>
                </form>
                </td>

                <td th:text="${u.phoneNumber}"></td>
                <td th:text="${u.balance}"></td>

                <td>
            <span class="badge"
                  th:text="${u.active} ? #{users.active} : #{users.blocked}"
                  th:classappend="${u.active} ? 'bg-success' : 'bg-danger'">
            </span>
                </td>

                <td>
                    <form th:action="@{/manage/users/{id}/status(id=${u.id})}"
                          method="post">

                        <input type="hidden" name="active" th:value="${!u.active}">

                        <button class="btn btn-sm"
                                th:classappend="${u.active} ? 'btn-outline-danger' : 'btn-outline-success'"
                                th:text="${u.active} ? #{users.block} : #{users.unblock}">
                        </button>

                    </form>
                </td>

            </tr>

            </tbody>

        </table>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}">
</th:block>

</body>
</html>
