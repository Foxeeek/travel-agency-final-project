<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head((${voucherId == null} ? #{form.title.new} : #{form.title.edit}))}">
</head>

<body>

<nav th:replace="~{fragments/layout :: navbar}">
</nav>

<div class="container mt-4" style="max-width: 600px;">

    <h1 class="mb-4"
        th:text="${voucherId == null} ? #{form.title.new} : #{form.title.edit}"></h1>

    <form th:action="${voucherId == null} ? @{/manage/vouchers} : @{/manage/vouchers/{id}(id=${voucherId})}"
          th:object="${voucherForm}"
          method="post">
        <div class="mb-3">
            <label class="form-label" for="title" th:text="#{form.label.title}"></label>

            <input type="text"
                   class="form-control"
                   id="title"
                   th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
            <div class="text-danger"
                 th:if="${#fields.hasErrors('title')}"
                 th:errors="*{title}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="description" th:text="#{form.label.description}"></label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
            <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="price" th:text="#{form.label.price}"></label>

            <input type="number"
                   step="0.01"
                   class="form-control"
                   id="price"
                   th:field="*{price}">

            <div class="text-danger"
                 th:if="${#fields.hasErrors('price')}"
                 th:errors="*{price}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="tourType" th:text="#{form.label.tourType}">e</label>

            <select class="form-select"
                    id="tourType"
                    th:field="*{tourType}">

                <option value="" th:text="#{form.choose}"></option>

                <option th:each="g : ${T(com.epam.finaltask.model.TourType).values()}"
                        th:value="${g}"
                        th:text="#{|enum.TourType.${g}|}">
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('tourType')}"
                 th:errors="*{tourType}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="hotelType" th:text="#{form.label.hotelType}"></label>

            <select class="form-select"
                    id="hotelType"
                    th:field="*{hotelType}">

                <option value="" th:text="#{form.choose}"></option>

                <option th:each="g : ${T(com.epam.finaltask.model.HotelType).values()}"
                        th:value="${g}"
                        th:text="#{|enum.HotelType.${g}|}">
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('hotelType')}"
                 th:errors="*{hotelType}">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="transferType" th:text="#{form.label.transferType}"></label>

            <select class="form-select"
                    id="transferType"
                    th:field="*{transferType}">

                <option value="" th:text="#{form.choose}"></option>

                <option th:each="g : ${T(com.epam.finaltask.model.TransferType).values()}"
                        th:value="${g}"
                        th:text="#{|enum.TransferType.${g}|}">
                </option>

            </select>

            <div class="text-danger"
                 th:if="${#fields.hasErrors('transferType')}"
                 th:errors="*{transferType}">
            </div>

            <div class="mb-3">
                <label class="form-label" for="arrivalDate" th:text="#{form.label.arrivalDate}"></label>
                <input type="date" class="form-control" id="arrivalDate" th:field="*{arrivalDate}">
                <div class="text-danger" th:if="${#fields.hasErrors('arrivalDate')}" th:errors="*{arrivalDate}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="evictionDate" th:text="#{form.label.evictionDate}"></label>
                <input type="date" class="form-control" id="evictionDate" th:field="*{evictionDate}">
                <div class="text-danger" th:if="${#fields.hasErrors('evictionDate')}" th:errors="*{evictionDate}"></div>
            </div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox"
                   class="form-check-input"
                   id="isHot"
                   th:field="*{isHot}">
            <label class="form-check-label" for="isHot" th:text="#{form.label.hot}"></label>
        </div>

        <button type="submit"
                class="btn btn-primary"
                th:text="${voucherId == null} ? #{form.create} : #{form.save}">
            Create
        </button>
        <a class="btn btn-outline-secondary" th:href="@{/manage}" th:text="#{form.cancel}"></a>

    </form>

</div>

<th:block th:replace="~{fragments/layout :: scripts}">
</th:block>

</body>
</html>
