<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(#{profile.title})}"
      th:text="${lang}">
</head>

<body>

<nav th:replace="~{fragments/layout :: navbar}">
</nav>

<div class="container mt-4">

    <h1 th:text="#{profile.title}"></h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <dl class="row">

        <dt class="col-sm-3" th:text="#{profile.login}" >Login</dt>
        <dd class="col-sm-9" th:text="${profile.username}"></dd>

        <dt class="col-sm-3" th:text="#{profile.balance}"></dt>
        <dd class="col-sm-9" th:text="${profile.balance}"></dd>
        <dt class="col-sm-3" th:text="#{profile.phone}"></dt>
        <dd class="col-sm-9" th:text="${profile.phoneNumber}"></dd>

    </dl>

        <form th:object="${profileForm}" th:action="@{/profile}" method="post">

            <input type="text" th:placeholder="#{profile.phone.placeholder}" th:field="*{phoneNumber}">
            <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>

            <input type="password"  th:placeholder="#{profile.password.placeholder}" th:field="*{password}">
            <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>

            <button type="submit" class="btn btn-primary" th:text="#{profile.save}"></button>
        </form>


    <h2 th:text="#{profile.vouchers}"></h2>

    <table class="table table-striped">

        <thead>
        <tr>
            <th th:text="#{profile.col.voucher}"></th>
            <th th:text="#{profile.col.status}"></th>
            <th th:text="#{profile.col.price}"></th>
            <th th:text="#{profile.col.from}"></th>
            <th th:text="#{profile.col.to}"></th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="v : ${vouchers}">
            <td th:text="${v.title}"></td>
            <td th:text="#{|enum.VoucherStatus.${v.status}|}"></td>
            <td th:text="${v.price}"></td>
            <td th:text="${v.arrivalDate}"></td>
            <td th:text="${v.evictionDate}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(vouchers)}">
            <td colspan="5" th:text="#{profile.empty}"></td>
        </tr>

        </tbody>

    </table>

</div>

<th:block th:replace="~{fragments/layout :: scripts}">
</th:block>

</body>
</html>
