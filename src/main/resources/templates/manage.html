<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">

<head th:replace="~{fragments/layout :: head(#{manage.title})}">
</head>

<body>

<nav th:replace="~{fragments/layout :: navbar}">
</nav>

<div class="container mt-4">
    <h1 th:text="#{manage.title}"></h1>

    <a class="btn btn-primary mb-3"
       th:href="@{/manage/vouchers/new}"
       sec:authorize="hasRole('ADMIN')"
       th:text="#{manage.new}">
    </a>


    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th th:text="#{manage.col.title}"></th>
            <th th:text="#{manage.col.status}"></th>
            <th th:text="#{manage.col.price}"></th>
            <th th:text="#{manage.col.owned}"></th>
            <th th:text="#{manage.col.hot}"></th>
            <th th:text="#{manage.col.action}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${page.content}">

            <td th:text="${v.title}"></td>
            <td th:text="#{|enum.VoucherStatus.${v.status}|}"></td>
            <td th:text="${v.price}"></td>
            <td th:text="${v.userId} ? #{manage.ordered} : '-'"></td>


            <td>
                <form th:action="@{/manage/vouchers/{id}/hot(id=${v.id})}"
                      method="post">

                    <input type="hidden"
                           name="hot"
                           th:value="${!v.isHot}">

                    <button class="btn btn-sm btn-outline-warning"
                            th:text="${v.isHot} ? #{manage.hot.remove} : #{manage.hot.make}">
                    </button>

                </form>
            </td>

            <td>
                <div th:if="${v.userId != null and v.status == 'REGISTERED'}">
                <form th:action="@{/manage/orders/{id}/status(id=${v.id})}"
                      method="post"
                      class="d-inline">
                    <input type="hidden" name="status" value="PAID">
                    <button class="btn btn-sm btn-success" th:text="#{manage.markPaid}"></button>
                </form>

                <form th:action="@{/manage/orders/{id}/status(id=${v.id})}"
                      method="post"
                      class="d-inline">
                    <input type="hidden" name="status" value="CANCELED">
                    <button class="btn btn-sm btn-danger" th:text="#{manage.cancel}"></button>
                </form>

                </div>
                <form th:action="@{/manage/vouchers/{id}/delete(id=${v.id})}"
                      method="post"
                      class="d-inline"
                      sec:authorize="hasRole('ADMIN')"
                      th:if="${v.userId == null}"
                      th:onsubmit="|return confirm('#{manage.confirm.delete}')|">
                    <button class="btn btn-sm btn-outline-danger" th:text="#{manage.delete}">
                    </button>
                </form>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/manage/vouchers/{id}/edit(id=${v.id})}"
                   sec:authorize="hasRole('ADMIN')"
                   th:if="${v.userId == null}" th:text="#{manage.edit}">
                </a>

            </td>

        </tr>
        </tbody>
    </table>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}">
</th:block>

</body>
</html>
