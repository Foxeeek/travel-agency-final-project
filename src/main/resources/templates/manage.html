<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Manage')}">
</head>

<body>

<nav th:replace="~{fragments/layout :: navbar}">
</nav>

<div class="container mt-4">
    <h1>Manage vouchers</h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Price</th>
            <th>Owned</th>
            <th>Hot</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${page.content}">

            <td th:text="${v.title}"></td>
            <td th:text="${v.status}"></td>
            <td th:text="${v.price}"></td>
            <td th:text="${v.userId} ? 'ordered' : '-'"></td>


            <td>
                <form th:action="@{/manage/vouchers/{id}/hot(id=${v.id})}"
                      method="post">

                    <input type="hidden"
                           name="hot"
                           th:value="${!v.isHot}">

                    <button class="btn btn-sm btn-outline-warning"
                            th:text="${v.isHot} ? 'Remove hot' : 'Make hot'">
                    </button>

                </form>
            </td>

            <td>
                <div th:if="${v.userId != null and v.status == 'REGISTERED'}">
                <form th:action="@{/manage/orders/{id}/status(id=${v.id})}"
                      method="post"
                      class="d-inline">
                    <input type="hidden" name="status" value="PAID">
                    <button class="btn btn-sm btn-success">Mark paid</button>
                </form>

                <form th:action="@{/manage/orders/{id}/status(id=${v.id})}"
                      method="post"
                      class="d-inline">
                    <input type="hidden" name="status" value="CANCELED">
                    <button class="btn btn-sm btn-danger">Cancel</button>
                </form>
                </div>
            </td>

        </tr>
        </tbody>
    </table>
    </div>

</div>

<th:block th:replace="~{fragments/layout :: scripts}">
</th:block>

</body>
</html>
