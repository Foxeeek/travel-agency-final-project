<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head(#{error.title})}">
</head>

<body>

<div class="container mt-5 text-center">
    <h1 class="display-4"
        th:text="${status} ?: #{error.title}">
    </h1>
    <p class="lead"
       th:text="${message} ?: 'error.default'">

    </p>

    <a class="btn btn-primary"
       th:href="@{/vouchers}"
       th:text="#{error.back}">
    </a>

</div>

<th:block th:replace="~{fragments/layout :: scripts}">
</th:block>

</body>
</html>
